{% extends 'base.html' %}
{% block title %}Post a Job{% endblock %}
{% block content %}
<h2>Post a job</h2>
<form method="post" class="card card-body">
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label">Job title</label><input class="form-control" name="title" required></div>
    <div class="col-md-6"><label class="form-label">Company</label><input class="form-control" name="company_name" value="HireHub"></div>
    <div class="col-md-4"><label class="form-label">Location</label><input class="form-control" name="location" value="Remote"></div>
    <div class="col-md-4"><label class="form-label">Employment type</label><input class="form-control" name="employment_type" value="Full-time"></div>
    <div class="col-md-4"><label class="form-label">Salary</label><input class="form-control" name="salary"></div>
    <div class="col-12"><label class="form-label">Requirements</label><input class="form-control" name="requirements" placeholder="Python, SQL, Teamwork"></div>
    <div class="col-12"><label class="form-label">Description</label><textarea class="form-control" name="description"></textarea></div>
  </div>
  <button class="btn btn-primary mt-3" type="submit">Publish job</button>
</form>
{% endblock %}
